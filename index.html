<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Thing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Next Thing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0614">
<link rel="preload" href="fonts/ChakraPetch-Regular.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-Regular.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-Medium.woff") format("woff");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-SemiBold.woff") format("woff");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Chakra Petch";src:url("fonts/ChakraPetch-Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.woff") format("woff");font-weight:100 800;font-style:normal;font-display:swap}
:root{
  --bg:#0a0614; --surface:#130c24; --surface2:#1b1233; --line:#2f2155; --ink:#f1ebff; --muted:#9a8bc6;
  --pink:#ff2bd6; --cyan:#22e6ff; --star:#ffe14d; --late:#ff4d6d; --ok:#3dffa8;
  --display:"Chakra Petch","Avenir Next Condensed",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* layout: habits strip on top, then a 3-column board (tabs on phones) with Morning / Afternoon / Later rows; + button floats bottom-right */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--display);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(255,43,214,.22), transparent 60%),
    radial-gradient(ellipse 80% 50% at 100% 110%, rgba(34,230,255,.12), transparent 60%),
    linear-gradient(rgba(150,110,255,.06) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, rgba(150,110,255,.06) 1px, transparent 1px) 0 0/28px 28px,
    var(--bg);}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.app{max-width:1200px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:700;font-size:22px;letter-spacing:.06em;margin:0;text-transform:uppercase;color:var(--ink);text-shadow:0 0 10px rgba(255,43,214,.7),0 0 24px rgba(255,43,214,.35)}
.logo span{color:var(--pink)}
.hright{display:flex;align-items:center;gap:8px}
.tally{font:500 12px var(--mono);color:var(--muted);text-align:right;line-height:1.3}
.tally b{color:var(--ok);text-shadow:0 0 8px rgba(61,255,168,.6)}
.iconbtn{min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:18px;display:grid;place-items:center;background:var(--surface)}

/* section labels */
.label{font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.label .n{color:var(--cyan)}

/* habits strip */
.habits{display:flex;flex-direction:column;gap:8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.hab{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px 6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);white-space:nowrap;font-size:14px;transition:box-shadow .2s,border-color .2s}
.hab .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--kc,var(--cyan));display:grid;place-items:center;font-size:13px;line-height:1;color:var(--bg)}
.hab.done{border-color:var(--kc,var(--cyan));box-shadow:0 0 14px -4px var(--kc,var(--cyan))}
.hab.done .box{background:var(--kc,var(--cyan))}
.hab.done .hn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--kc,var(--cyan))}
.hab .st{font:500 11px var(--mono);color:var(--star)}
.hab.k-chore{--kc:var(--star)} .hab.k-work{--kc:var(--pink)} .hab.k-routine{--kc:var(--ok)}
.hab.add{color:var(--muted);border-style:dashed;padding:6px 14px}

/* banner + load */
.banner{border:1px solid var(--pink);border-radius:14px;padding:12px;background:rgba(255,43,214,.08);display:flex;flex-direction:column;gap:10px;box-shadow:0 0 20px -8px var(--pink)}
.banner p{margin:0;font-size:14px}
.banner .row{display:flex;gap:8px}
.load{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lslot{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.lslot .top{display:flex;justify-content:space-between;align-items:baseline;font:600 11px var(--mono);letter-spacing:.1em;color:var(--muted)}
.lslot .v{font:700 15px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.lslot.heavy .v{color:var(--late);text-shadow:0 0 8px rgba(255,77,109,.6)}
.bar{height:5px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 8px var(--pink)}
.lslot.heavy .bar i{background:var(--late)}
.lnote{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0;background:linear-gradient(var(--bg) 80%,transparent);margin-top:-4px}
.tab{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:600 13px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tab .c{opacity:.8}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--pink);box-shadow:0 0 16px -4px var(--pink),inset 0 0 12px -6px var(--pink)}
.tab[data-tab="doing"][aria-selected="true"]{border-color:var(--cyan);box-shadow:0 0 16px -4px var(--cyan),inset 0 0 12px -6px var(--cyan)}
.tab[data-tab="done"][aria-selected="true"]{border-color:var(--ok);box-shadow:0 0 16px -4px var(--ok),inset 0 0 12px -6px var(--ok)}

/* board */
.cols{display:grid;grid-template-columns:1fr;gap:14px}
.col{display:none;flex-direction:column;gap:14px}
.col.on{display:flex}
.colhead{display:none}
.row{display:flex;flex-direction:column;gap:8px}
.rowhead{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.rowhead .t{display:flex;align-items:center;gap:8px}
.rowhead .t::before{content:"";width:3px;height:12px;background:var(--rc,var(--cyan));box-shadow:0 0 8px var(--rc,var(--cyan));border-radius:2px}
.row.am{--rc:var(--star)} .row.pm{--rc:var(--pink)} .row.later{--rc:var(--muted)}
.rowhead .sum{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:13px;text-align:center}

.card{position:relative;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--surface2),var(--surface));padding:12px 12px 10px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--sc,var(--line));box-shadow:0 0 10px var(--sc,transparent)}
.card.t0{--sc:var(--late)} .card.t1{--sc:var(--pink)} .card.t2,.card.t4{--sc:var(--star)} .card.t3{--sc:var(--cyan)}
.card.doing{border-color:rgba(34,230,255,.5);box-shadow:0 0 18px -8px var(--cyan)}
.card.isdone{opacity:.65}
.card.isdone .ct{text-decoration:line-through;text-decoration-color:var(--ok)}
.ct{font-size:16px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ct .s{color:var(--star);margin-right:4px;text-shadow:0 0 8px rgba(255,225,77,.6)}
.cbot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11px var(--mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.late{color:var(--late);border-color:rgba(255,77,109,.5)}
.chip.today{color:var(--pink);border-color:rgba(255,43,214,.5)}
.cacts{display:flex;gap:6px;flex:0 0 auto}
.cbtn{min-height:36px;min-width:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);padding:0 10px;background:rgba(0,0,0,.2)}
.cbtn.go{color:var(--cyan);border-color:rgba(34,230,255,.5)}
.cbtn.fin{color:var(--ok);border-color:rgba(61,255,168,.5)}

/* fab */
.fab{position:fixed;right:max(18px, env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--pink);color:#12051a;font-size:32px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 24px rgba(255,43,214,.7),0 8px 24px rgba(0,0,0,.5);z-index:20}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,2,12,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:620px;max-height:88%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px -10px rgba(255,43,214,.35)}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h2{margin:0;font-size:18px;letter-spacing:.04em}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
input[type=text]:focus,textarea:focus{border-color:var(--pink);box-shadow:0 0 14px -4px var(--pink);outline:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--cyan);box-shadow:0 0 12px -4px var(--cyan);background:rgba(34,230,255,.08)}
.seg.pinkseg button[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 12px -4px var(--pink);background:rgba(255,43,214,.08)}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:0 16px}
.btn.primary{background:var(--pink);color:#12051a;border-color:transparent;box-shadow:0 0 18px -4px var(--pink)}
.btn.cyan{border-color:var(--cyan);color:var(--cyan)}
.btn.danger{color:var(--late);border-color:rgba(255,77,109,.4)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1;min-width:130px}
.hint{font-size:12px;color:var(--muted);margin:0}
.hlist{display:flex;flex-direction:column;gap:6px}
.hitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;background:var(--bg)}
.hitem .grow{flex:1;min-width:0}
.hitem .nm{overflow-wrap:anywhere}
.hitem small{display:block;font:500 11px var(--mono);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;background:var(--kc,var(--cyan));box-shadow:0 0 8px var(--kc,var(--cyan));flex:0 0 auto}
.k-chore{--kc:var(--star)} .k-work{--kc:var(--pink)} .k-routine{--kc:var(--ok)}

/* timer */
.timer{position:fixed;inset:0;z-index:40;background:rgba(6,2,14,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.timer[hidden]{display:none}
.ring{--p:0;width:min(72vw,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pink) calc(var(--p)*1turn), var(--surface2) 0);box-shadow:0 0 40px -6px rgba(255,43,214,.6);position:relative}
.ring::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.ring .tm{position:relative;z-index:1;font:700 clamp(44px,14vw,64px) var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 18px rgba(34,230,255,.7)}
.timer .tt{font-size:20px;font-weight:600;text-align:center;max-width:32ch;overflow-wrap:anywhere}
.timer .lbl{font:600 12px var(--mono);letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}
.timer .btns{width:min(100%,420px)}
.btns[hidden]{display:none}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--cyan);box-shadow:0 0 18px -6px var(--cyan);border-radius:12px;padding:6px 6px 6px 14px;display:flex;gap:8px;align-items:center;font-size:14px;z-index:50;width:max-content;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{color:var(--cyan);font-weight:600;padding:8px 10px;min-height:36px}

/* wide screens: all three columns */
@media (min-width:900px){
  .tabs{display:none}
  .cols{grid-template-columns:repeat(3,1fr);align-items:start}
  .col{display:flex}
  .colhead{display:flex;justify-content:space-between;font:700 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .col[data-col="todo"] .colhead{border-color:var(--pink);box-shadow:0 0 14px -6px var(--pink)}
  .col[data-col="doing"] .colhead{border-color:var(--cyan);box-shadow:0 0 14px -6px var(--cyan)}
  .col[data-col="done"] .colhead{border-color:var(--ok);box-shadow:0 0 14px -6px var(--ok)}
  .load{grid-template-columns:1fr 1fr;max-width:600px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="logo">Next<span>//</span>Thing</h1>
    <div class="hright">
      <div class="tally" id="tally"></div>
      <button class="iconbtn" data-act="backup" aria-label="Backup and settings">⋯</button>
    </div>
  </header>

  <section class="habits" aria-label="Habits and routines">
    <div class="label">Today's routines <span class="n" id="habCount"></span></div>
    <div class="strip" id="strip"></div>
  </section>

  <div id="banner"></div>

  <section class="load" id="load" aria-label="Today's plan"></section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="cols" id="cols"></section>
</div>

<button class="fab" data-act="add" aria-label="Add a task">+</button>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="timer" id="timer" hidden>
  <div class="lbl" id="tLbl">Focus</div>
  <div class="ring" id="ring"><div class="tm" id="tTime">25:00</div></div>
  <div class="tt" id="tTitle"></div>
  <div class="btns" id="tRun">
    <button class="btn cyan" data-act="tpause" id="tPause">Pause</button>
    <button class="btn primary" data-act="tdone">Task done</button>
    <button class="btn" data-act="tstop">Stop</button>
  </div>
  <div class="btns" id="tAsk" hidden>
    <p class="hint" style="width:100%;text-align:center;font-size:15px;color:var(--ink)">Did you finish it?</p>
    <button class="btn primary" data-act="tq" data-v="done">Yes, it's done</button>
    <button class="btn cyan" data-act="tq" data-v="doing">Not yet (keep in Doing)</button>
    <button class="btn" data-act="tq" data-v="todo">Move back to To do</button>
    <button class="btn" data-act="tq" data-v="resume" style="flex-basis:100%">Keep the timer going</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>

<script>
(function(){
  "use strict";
  const KEY = "nextthing.v2", OLD = "nextthing.v1", TKEY = "nextthing.timer";
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  let S = { tasks: [], habits: [], hlog: {}, log: {}, planDate: null };
  let tab = "todo";
  let sheet = null;                // { type, id }
  let addPrefs = { slot: "am", est: 30, due: "today", star: false, text: "" };
  let habDraft = { t: "", kind: "habit", freq: "daily", days: [1], dom: 1 };
  let undoSnap = null, toastTimer = null;
  let T = null;                    // focus timer { id, end, dur, paused, left }
  let tTick = null;

  // ---------- dates ----------
  const pad = n => String(n).padStart(2, "0");
  const dayStr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = () => dayStr(new Date());
  const addDays = (n, from) => { const d = from ? new Date(from + "T12:00") : new Date(); d.setDate(d.getDate() + n); return dayStr(d); };
  const daysBetween = (a, b) => Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  function dueLabel(d){
    if (!d) return null;
    const n = daysBetween(today(), d);
    if (n < 0) return { txt: (-n) + "d late", cls: "late" };
    if (n === 0) return { txt: "today", cls: "today" };
    if (n === 1) return { txt: "tmrw", cls: "" };
    if (n < 7) return { txt: DOW[new Date(d + "T12:00").getDay()], cls: "" };
    return { txt: new Date(d + "T12:00").toLocaleDateString(undefined, { day: "numeric", month: "short" }), cls: "" };
  }
  const fmtMin = m => { if (!m) return "0m"; const h = Math.floor(m / 60), r = m % 60; return h ? (h + "h" + (r ? " " + r + "m" : "")) : r + "m"; };
  const EST = [[5,"5m"],[15,"15m"],[30,"30m"],[60,"1h"],[120,"2h"],[180,"3h+"]];
  const estLabel = m => { const f = EST.find(e => e[0] === m); return f ? f[1] : (m ? fmtMin(m) : "?"); };
  const dueFor = w => w === "today" ? today() : w === "week" ? addDays(6) : null;
  const dueKey = d => !d ? "someday" : d <= today() ? "today" : "week";

  // ---------- ranking ----------
  function tier(t){
    const td = today();
    if (t.due && t.due < td) return 0;
    if (t.due === td) return 1;
    if (t.due) return t.star ? 2 : 3;
    return t.star ? 4 : 5;
  }
  const cmp = (a, b) => tier(a) - tier(b) || (a.due || "9999").localeCompare(b.due || "9999") || a.created - b.created;
  const byId = id => S.tasks.find(t => t.id === id);

  // ---------- habits ----------
  function lastDom(dateStr){ const d = new Date(dateStr + "T12:00"); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
  function dueOn(h, ds){
    const d = new Date(ds + "T12:00"), w = d.getDay();
    if (ds < dayStr(new Date(h.created))) return false;
    switch (h.freq) {
      case "daily": return true;
      case "weekdays": return w >= 1 && w <= 5;
      case "weekly": return (h.days || []).includes(w);
      case "monthly": return d.getDate() === Math.min(h.dom || 1, lastDom(ds));
    }
    return false;
  }
  const doneOn = (h, ds) => (S.hlog[ds] || []).includes(h.id);
  function streak(h){
    let n = 0, ds = today();
    for (let i = 0; i < 400; i++) {
      if (dueOn(h, ds)) {
        if (doneOn(h, ds)) n++;
        else if (ds !== today()) break;
      }
      if (ds <= dayStr(new Date(h.created))) break;
      ds = addDays(-1, ds);
    }
    return n;
  }
  function freqText(h){
    if (h.freq === "daily") return "Every day";
    if (h.freq === "weekdays") return "Weekdays";
    if (h.freq === "weekly") return "Every " + ((h.days || []).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d => DOW[d]).join(", ") || "week");
    if (h.freq === "monthly") { const n = h.dom || 1; const sfx = (n % 10 === 1 && n !== 11) ? "st" : (n % 10 === 2 && n !== 12) ? "nd" : (n % 10 === 3 && n !== 13) ? "rd" : "th"; return "Monthly on the " + n + sfx; }
    return "";
  }
  const KINDS = [["habit","Habit"],["chore","Chore"],["work","Work"],["routine","Start/shutdown"]];

  // ---------- storage ----------
  function normalize(d){
    return {
      tasks: Array.isArray(d && d.tasks) ? d.tasks.filter(t => t && t.id && t.t) : [],
      habits: Array.isArray(d && d.habits) ? d.habits.filter(h => h && h.id && h.t) : [],
      hlog: (d && d.hlog && typeof d.hlog === "object") ? d.hlog : {},
      log: (d && d.log && typeof d.log === "object") ? d.log : {},
      planDate: (d && d.planDate) || null
    };
  }
  function load(){
    try {
      const r = localStorage.getItem(KEY);
      if (r) { S = normalize(JSON.parse(r)); return; }
      const o = localStorage.getItem(OLD);
      if (o) {   // bring tasks over from the first version
        const v1 = JSON.parse(o);
        S.tasks = (v1.tasks || []).filter(t => t && t.t && !t.parent).map(t => ({
          id: t.id || uid(), t: t.t, star: !!t.star, due: t.due || null, est: null,
          slot: (t.due && t.due <= today()) ? "am" : "later", status: "todo", created: t.created || Date.now()
        }));
        S.log = v1.log || {};
      }
    } catch (e) {}
  }
  function prune(){
    const cutoff = Date.now() - 14 * 864e5;
    S.tasks = S.tasks.filter(t => t.status !== "done" || (t.doneAt || 0) > cutoff);
    const keep = addDays(-400);
    Object.keys(S.hlog).forEach(k => { if (k < keep) delete S.hlog[k]; });
    const lk = Object.keys(S.log).sort(); while (lk.length > 60) delete S.log[lk.shift()];
  }
  function save(){
    prune();
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast("Couldn't save on this phone. Make a backup from the ⋯ menu.", null); }
  }
  function mutate(fn, msg){
    const before = JSON.stringify(S);
    fn(); save(); render();
    if (sheet && sheet.type === "task") { if (byId(sheet.id)) renderSheet(); else closeSheet(); }
    if (msg) toast(msg, before);
  }

  // ---------- toast ----------
  function toast(msg, snap){
    undoSnap = snap;
    $("#toastMsg").textContent = msg;
    $("#toastUndo").hidden = !snap;
    $("#toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { $("#toast").hidden = true; undoSnap = null; }, 4500);
  }
  $("#toastUndo").addEventListener("click", () => {
    if (!undoSnap) return;
    S = normalize(JSON.parse(undoSnap)); undoSnap = null; $("#toast").hidden = true;
    save(); render(); if (sheet) renderSheet();
  });

  // ---------- task actions ----------
  function setStatus(id, st){
    mutate(() => {
      const t = byId(id); if (!t) return;
      const was = t.status;
      t.status = st;
      if (st === "done" && was !== "done") { t.doneAt = Date.now(); const k = today(); S.log[k] = (S.log[k] || 0) + 1; }
      if (st !== "done" && was === "done") { t.doneAt = null; const k = today(); if (S.log[k]) S.log[k]--; }
    }, st === "done" ? "Done. Nice work." : null);
  }

  // ---------- render ----------
  function render(){
    renderHeader(); renderStrip(); renderBanner(); renderLoad(); renderBoard();
  }
  function renderHeader(){
    const n = S.log[today()] || 0;
    const d = new Date().toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }).toUpperCase();
    $("#tally").innerHTML = esc(d) + "<br>" + (n ? "<b>" + n + " done</b> today" : "0 done today");
  }
  function renderStrip(){
    const td = today();
    const due = S.habits.filter(h => dueOn(h, td));
    const done = due.filter(h => doneOn(h, td)).length;
    $("#habCount").textContent = due.length ? done + "/" + due.length : "";
    let html = due.map(h => {
      const st = streak(h), dn = doneOn(h, td);
      return '<button class="hab k-' + esc(h.kind) + (dn ? " done" : "") + '" data-act="habit" data-id="' + esc(h.id) + '" aria-pressed="' + dn + '">' +
        '<span class="box">' + (dn ? "✓" : "") + '</span><span class="hn">' + esc(h.t) + '</span>' +
        (st > 1 ? '<span class="st">×' + st + '</span>' : "") + '</button>';
    }).join("");
    html += '<button class="hab add" data-act="habits">' + (S.habits.length ? "Edit" : "+ Add habits &amp; routines") + '</button>';
    $("#strip").innerHTML = html;
  }
  function renderBanner(){
    const td = today();
    const stale = S.planDate && S.planDate < td ? S.tasks.filter(t => t.status === "todo" && (t.slot === "am" || t.slot === "pm")) : [];
    if (!stale.length) { $("#banner").innerHTML = ""; return; }
    $("#banner").innerHTML = '<div class="banner"><p><b>New day.</b> ' + stale.length + ' task' + (stale.length > 1 ? "s are" : " is") +
      ' still planned from before. Keep the plan, or clear it and start fresh?</p><div class="row">' +
      '<button class="btn cyan" data-act="plankeep">Keep plan</button><button class="btn" data-act="planclear">Clear to Later</button></div></div>';
  }
  function renderLoad(){
    const CAP = 240;
    const open = S.tasks.filter(t => t.status !== "done");
    const html = [["am","Morning"],["pm","Afternoon"]].map(([k, name]) => {
      const ts = open.filter(t => t.slot === k);
      const mins = ts.reduce((a, t) => a + (t.est || 0), 0);
      const unk = ts.filter(t => !t.est).length;
      const heavy = mins > CAP;
      return '<div class="lslot' + (heavy ? " heavy" : "") + '"><div class="top"><span>' + name.toUpperCase() + '</span><span class="v">' + fmtMin(mins) + '</span></div>' +
        '<div class="bar"><i style="width:' + Math.min(100, Math.round(mins / CAP * 100)) + '%"></i></div>' +
        '<div class="lnote">' + (heavy ? "More than 4h. Move something?" : ts.length + " task" + (ts.length === 1 ? "" : "s") + (unk ? " · " + unk + " no estimate" : "")) + '</div></div>';
    }).join("");
    $("#load").innerHTML = html;
  }
  function cardHTML(t){
    const tr = tier(t), dl = dueLabel(t.due);
    const cls = "card" + (t.status === "doing" ? " doing" : "") + (t.status === "done" ? " isdone" : " t" + tr);
    let acts = "";
    if (t.status === "todo") acts = '<button class="cbtn" data-act="timer" data-id="' + t.id + '" aria-label="Start focus timer">⏱</button><button class="cbtn go" data-act="adv" data-id="' + t.id + '">Start ▸</button>';
    else if (t.status === "doing") acts = '<button class="cbtn" data-act="timer" data-id="' + t.id + '" aria-label="Start focus timer">⏱</button><button class="cbtn fin" data-act="adv" data-id="' + t.id + '">Done ✓</button>';
    else acts = '<button class="cbtn" data-act="back" data-id="' + t.id + '" aria-label="Move back to To do">↺</button>';
    return '<article class="' + cls + '" data-act="open" data-id="' + t.id + '" tabindex="0" role="button" aria-label="Edit ' + esc(t.t) + '">' +
      '<div class="ct">' + (t.star ? '<span class="s" aria-label="Matters">★</span>' : "") + esc(t.t) + '</div>' +
      '<div class="cbot"><div class="meta"><span class="chip">' + estLabel(t.est) + '</span>' +
      (dl && t.status !== "done" ? '<span class="chip ' + dl.cls + '">' + esc(dl.txt) + '</span>' : "") +
      '</div><div class="cacts">' + acts + '</div></div></article>';
  }
  const SLOTS = [["am","Morning"],["pm","Afternoon"],["later","Later"]];
  function renderBoard(){
    const cols = [["todo","To do"],["doing","Doing"],["done","Done"]];
    const counts = {};
    cols.forEach(([k]) => counts[k] = S.tasks.filter(t => t.status === k).length);
    $("#tabs").innerHTML = cols.map(([k, n]) => '<button class="tab" role="tab" data-act="tab" data-tab="' + k + '" aria-selected="' + (tab === k) + '">' + n + ' <span class="c">' + counts[k] + '</span></button>').join("");

    $("#cols").innerHTML = cols.map(([k, name]) => {
      let inner = '<div class="colhead"><span>' + name + '</span><span>' + counts[k] + '</span></div>';
      if (k === "done") {
        const done = S.tasks.filter(t => t.status === "done").sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
        const startToday = new Date(); startToday.setHours(0,0,0,0);
        const groups = [["Today", done.filter(t => (t.doneAt || 0) >= startToday.getTime())], ["Earlier", done.filter(t => (t.doneAt || 0) < startToday.getTime())]];
        groups.forEach(([g, ts]) => {
          if (!ts.length && g === "Earlier") return;
          inner += '<div class="row later" style="--rc:var(--ok)"><div class="rowhead"><span class="t">' + g + '</span><span class="sum">' + ts.length + '</span></div>' +
            (ts.length ? ts.map(cardHTML).join("") : '<div class="empty">Nothing finished yet today. Start one small thing.</div>') + '</div>';
        });
        if (done.length) inner += '<p class="hint">Finished tasks clear themselves after 2 weeks.</p>';
      } else {
        SLOTS.forEach(([s, sname]) => {
          const ts = S.tasks.filter(t => t.status === k && t.slot === s).sort(cmp);
          const mins = ts.reduce((a, t) => a + (t.est || 0), 0);

          inner += '<div class="row ' + s + '"><div class="rowhead"><span class="t">' + sname + '</span><span class="sum">' + (ts.length ? fmtMin(mins) : "") + '</span></div>' +
            (ts.length ? ts.map(cardHTML).join("") : '<div class="empty">' + (k === "doing" ? "Nothing in progress" : s === "later" ? "Unplanned tasks land here" : "Nothing planned") + '</div>') + '</div>';
        });
      }
      return '<div class="col' + (tab === k ? " on" : "") + '" data-col="' + k + '" role="tabpanel">' + inner + '</div>';
    }).join("");
  }

  // ---------- sheets ----------
  function seg(group, options, current, extra){
    return '<div class="seg ' + (extra || "") + '" role="group">' + options.map(([v, l]) => '<button type="button" data-act="seg" data-g="' + group + '" data-v="' + esc(v) + '" aria-pressed="' + (String(current) === String(v)) + '">' + l + '</button>').join("") + '</div>';
  }
  function openSheet(type, id){ sheet = { type, id }; renderSheet(); $("#scrim").hidden = false; setTimeout(() => { const f = $("#sheet [data-autofocus]"); if (f) f.focus(); }, 30); }
  function closeSheet(){ sheet = null; $("#scrim").hidden = true; $("#sheet").innerHTML = ""; }
  function renderSheet(){
    if (!sheet) return;
    const el = $("#sheet"); let h = "";
    const head = title => '<div class="shead"><h2>' + title + '</h2><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>';
    if (sheet.type === "add") {
      h = head("Add a task") +
        '<form id="addForm" class="field"><label for="addText" style="position:absolute;left:-9999px">Task</label>' +
        '<input type="text" id="addText" data-autofocus placeholder="What needs doing?" enterkeyhint="done" autocomplete="off" value="' + esc(addPrefs.text) + '"></form>' +

        '<div class="field"><label for="editText" style="position:absolute;left:-9999px">Task</label><input type="text" id="editText" value="' + esc(t.t) + '" autocomplete="off"></div>' +
        '<div class="field"><span>Status</span>' + seg("t.status", [["todo","To do"],["doing","Doing"],["done","Done"]], t.status) + '</div>' +

        '<div class="field"><span>How long</span>' + seg("t.est", EST, t.est) + '</div>' +
        '<div class="field"><span>Due' + (t.due ? " · " + esc(new Date(t.due + "T12:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })) : "") + '</span>' + seg("t.due", [["today","Today"],["week","This week"],["someday","No date"]], dueKey(t.due)) + '</div>' +
        '<div class="field"><span>Matters?</span>' + seg("t.star", [["true","★ Yes"],["false","Normal"]], !!t.star, "pinkseg") + '</div>' +
        '<div class="btns">' + (t.status !== "done" ? '<button class="btn cyan" data-act="timer" data-id="' + t.id + '">⏱ Focus 25 min</button>' : "") +
        '<button class="btn danger" data-act="del" data-id="' + t.id + '">Delete</button></div>';
    } else if (sheet.type === "habits") {
      const list = S.habits.map(x => '<div class="hitem k-' + esc(x.kind) + '"><span class="dot"></span><div class="grow"><div class="nm">' + esc(x.t) + '</div><small>' +
        esc((KINDS.find(k => k[0] === x.kind) || ["","Habit"])[1]) + " · " + esc(freqText(x)) + (streak(x) > 1 ? " · streak " + streak(x) : "") + '</small></div>' +
        '<button class="iconbtn" data-act="delhab" data-id="' + esc(x.id) + '" aria-label="Delete ' + esc(x.t) + '">✕</button></div>').join("");
      let freqExtra = "";
      if (habDraft.freq === "weekly") freqExtra = '<div class="field"><span>On which days</span><div class="seg" role="group">' +
        [1,2,3,4,5,6,0].map(d => '<button type="button" data-act="hday" data-v="' + d + '" aria-pressed="' + habDraft.days.includes(d) + '">' + DOW[d] + '</button>').join("") + '</div></div>';
      if (habDraft.freq === "monthly") freqExtra = '<div class="field"><label for="habDom"><span style="font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Day of the month</span></label><select id="habDom">' +
        Array.from({ length: 31 }, (_, i) => '<option value="' + (i + 1) + '"' + (habDraft.dom === i + 1 ? " selected" : "") + '>' + (i + 1) + '</option>').join("") + '</select></div>';
      h = head("Habits &amp; routines") +
        (list ? '<div class="hlist">' + list + '</div>' : '<p class="hint">Nothing yet. Add habits (exercise, reading), chores (bins, rent), work routines (weekly report) or a start/shutdown checklist. They show up in the strip on the days they\'re due.</p>') +
        '<div class="label" style="margin-top:6px">Add one</div>' +
        '<form id="habForm" class="field"><label for="habText" style="position:absolute;left:-9999px">Name</label><input type="text" id="habText" placeholder="e.g. Put the bins out" autocomplete="off" value="' + esc(habDraft.t) + '"></form>' +
        '<div class="field"><span>Type</span>' + seg("h.kind", KINDS, habDraft.kind) + '</div>' +
        '<div class="field"><span>How often</span>' + seg("h.freq", [["daily","Every day"],["weekdays","Weekdays"],["weekly","Weekly"],["monthly","Monthly"]], habDraft.freq) + '</div>' +
        freqExtra +
        '<div class="btns"><button class="btn primary" data-act="habgo">Add</button></div>';
    } else if (sheet.type === "backup") {
      h = head("Backup") +
        '<p class="hint">Everything lives only on this phone. Save a backup now and then, in case you switch phones or the data gets cleared.</p>' +
        '<div class="btns"><button class="btn primary" data-act="bksave">Save backup file</button><button class="btn" data-act="bkcopy">Copy as text</button></div>' +
        '<div class="field"><label for="bkText"><span style="font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">Restore</span></label><textarea id="bkText" rows="4" placeholder="Paste backup text here"></textarea></div>' +
        '<div class="btns"><button class="btn cyan" data-act="bkrestore">Restore from text</button><button class="btn" data-act="bkfile">Restore from file</button></div>' +
        '<input type="file" id="bkFile" accept=".json,application/json,text/plain" hidden>';
    }
    el.innerHTML = h;
  }

  // ---------- timer ----------
  function saveTimer(){ try { T ? localStorage.setItem(TKEY, JSON.stringify(T)) : localStorage.removeItem(TKEY); } catch (e) {} }
  function startTimer(id){
    const t = byId(id); if (!t) return;
    if (t.status === "todo") setStatus(id, "doing");
    T = { id, dur: 25 * 60e3, end: Date.now() + 25 * 60e3, paused: false, left: 25 * 60e3 };
    saveTimer(); closeSheet(); showTimer();
  }
  function showTimer(){
    if (!T) return;
    const t = byId(T.id);
    $("#tTitle").textContent = t ? t.t : "";
    $("#timer").hidden = false;
    $("#tAsk").hidden = !T.asking; $("#tRun").hidden = !!T.asking;
    tickTimer(); clearInterval(tTick); tTick = setInterval(tickTimer, 500);
  }
  function tickTimer(){
    if (!T) return;
    const left = T.paused ? T.left : Math.max(0, T.end - Date.now());
    const s = Math.ceil(left / 1000);
    $("#tTime").textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    $("#ring").style.setProperty("--p", (1 - left / T.dur).toFixed(4));
    $("#tPause").textContent = T.paused ? "Resume" : "Pause";
    if (left <= 0) {
      $("#tLbl").textContent = "Time's up. Done, or keep going?";
      $("#tPause").textContent = "+5 min";
      if (!T.buzzed) { T.buzzed = true; saveTimer(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
    } else $("#tLbl").textContent = T.asking ? "Stopped" : T.paused ? "Paused" : "Focus";
  }
  function endTimer(){ T = null; saveTimer(); clearInterval(tTick); $("#timer").hidden = true; $("#tAsk").hidden = true; $("#tRun").hidden = false; }

  // ---------- backup ----------
  const backupText = () => JSON.stringify({ app: "next-thing", v: 2, saved: new Date().toISOString(), ...S });
  async function bkSave(){
    const name = "next-thing-backup-" + today() + ".json";
    const blob = new Blob([backupText()], { type: "application/json" });
    try {
      const file = new File([blob], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Next Thing backup" }); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  function restore(raw){
    try {
      const d = JSON.parse(raw);
      if (!d || !Array.isArray(d.tasks)) throw new Error("bad");
      const before = JSON.stringify(S);
      if (d.v === 2) S = normalize(d);
      else { localStorage.removeItem(KEY); localStorage.setItem(OLD, raw); S = normalize({}); load(); }
      save(); render(); closeSheet();
      toast("Restored " + S.tasks.length + " tasks.", before);
    } catch (e) { toast("That doesn't look like a Next Thing backup.", null); }
  }

  // ---------- events ----------
  function addTask(){
    const inp = $("#addText"); const v = (inp ? inp.value : addPrefs.text).trim();
    if (!v) { inp && inp.focus(); return; }
    mutate(() => S.tasks.push({ id: uid(), t: v, star: addPrefs.star, due: dueFor(addPrefs.due), est: addPrefs.est, slot: addPrefs.slot, status: "todo", created: Date.now() }));
    addPrefs.text = "";
    closeSheet();
    toast("Added: " + v, null);
  }
  function addHabit(){
    const inp = $("#habText"); const v = (inp ? inp.value : habDraft.t).trim();
    if (!v) { inp && inp.focus(); return; }
    if (habDraft.freq === "weekly" && !habDraft.days.length) { toast("Pick at least one day.", null); return; }
    mutate(() => S.habits.push({ id: uid(), t: v, kind: habDraft.kind, freq: habDraft.freq, days: habDraft.days.slice(), dom: habDraft.dom, created: Date.now() }));
    habDraft.t = "";
    closeSheet();
    toast("Added: " + v, null);
  }

  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]"); if (!b) {
      if (ev.target === $("#scrim")) closeSheet();
      return;
    }
    const act = b.dataset.act, id = b.dataset.id;
    switch (act) {
      case "tab": tab = b.dataset.tab; renderBoard(); window.scrollTo({ top: Math.min(window.scrollY, $("#tabs").offsetTop - 4) }); break;
      case "adv": { const t = byId(id); if (t) setStatus(id, t.status === "todo" ? "doing" : "done"); if (t && t.status === "doing") toast("Moved to Doing.", null); break; }
      case "back": setStatus(id, "todo"); break;
      case "open": openSheet("task", id); break;
      case "timer": startTimer(id); break;
      case "habit": mutate(() => {
          const td = today(); const arr = S.hlog[td] = S.hlog[td] || [];
          const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else arr.push(id);
          if (!arr.length) delete S.hlog[td];
        }); break;
      case "habits": openSheet("habits"); break;
      case "backup": openSheet("backup"); break;
      case "add": openSheet("add"); break;
      case "close": closeSheet(); break;
      case "addgo": addTask(); break;
      case "habgo": addHabit(); break;
      case "del": { const t = byId(id); mutate(() => { S.tasks = S.tasks.filter(x => x.id !== id); }, "Deleted: " + (t ? t.t : "")); break; }
      case "delhab": { const x = S.habits.find(h => h.id === id); mutate(() => { S.habits = S.habits.filter(h => h.id !== id); }, "Removed: " + (x ? x.t : "")); renderSheet(); break; }
      case "hday": { const d = +b.dataset.v; const i = habDraft.days.indexOf(d); if (i >= 0) habDraft.days.splice(i, 1); else habDraft.days.push(d); renderSheet(); break; }
      case "seg": {
        const [scope, field] = b.dataset.g.split("."); let v = b.dataset.v;
        if (field === "est") v = +v;
        if (field === "star") v = v === "true";
        if (scope === "a") { addPrefs[field] = v; renderSheet(); const n = $("#addText"); if (n) { n.focus(); const L = n.value.length; try { n.setSelectionRange(L, L); } catch (e) {} } }
        else if (scope === "h") { habDraft[field] = v; renderSheet(); }
        else if (scope === "t") {
          if (field === "status") { setStatus(sheet.id, v); break; }
          mutate(() => { const t = byId(sheet.id); if (!t) return; if (field === "due") t.due = dueFor(v); else t[field] = v; });
        }
        break;
      }
      case "plankeep": mutate(() => { S.planDate = today(); }); break;
      case "planclear": mutate(() => { S.tasks.forEach(t => { if (t.status === "todo" && (t.slot === "am" || t.slot === "pm")) t.slot = "later"; }); S.planDate = today(); }, "Plan cleared. Fresh start."); break;
      case "tpause":
        if (!T) break;
        if (Math.max(0, T.end - Date.now()) <= 0 && !T.paused) { T.end = Date.now() + 5 * 60e3; T.dur = 5 * 60e3; T.buzzed = false; }
        else if (T.paused) { T.end = Date.now() + T.left; T.paused = false; }
        else { T.left = Math.max(0, T.end - Date.now()); T.paused = true; }
        saveTimer(); tickTimer(); break;
      case "tdone": { const tid = T && T.id; endTimer(); if (tid && byId(tid)) setStatus(tid, "done"); break; }
      case "tstop":
        if (!T) break;
        if (!T.paused) { T.left = Math.max(0, T.end - Date.now()); T.paused = true; T.asking = true; } else T.asking = true;
        saveTimer(); tickTimer(); $("#tRun").hidden = true; $("#tAsk").hidden = false; break;
      case "tq": {
        const v = b.dataset.v, tid = T && T.id;
        if (v === "resume") {
          if (T) { T.asking = false; if (T.left > 0) { T.end = Date.now() + T.left; T.paused = false; } saveTimer(); }
          $("#tAsk").hidden = true; $("#tRun").hidden = false; tickTimer(); break;
        }
        endTimer();
        if (tid && byId(tid)) {
          if (v === "done") setStatus(tid, "done");
          else if (v === "todo") { setStatus(tid, "todo"); tab = "todo"; renderBoard(); toast("Moved back to To do.", null); }
          else { tab = "doing"; renderBoard(); toast("Still in Doing. Pick it up when you're ready.", null); }
        }
        break;
      }
      case "bksave": bkSave(); break;
      case "bkcopy":
        navigator.clipboard.writeText(backupText()).then(() => toast("Backup copied. Paste it into Notes or an email to yourself.", null))
          .catch(() => { const ta = $("#bkText"); ta.value = backupText(); ta.select(); toast("Select all and copy the text in the box.", null); });
        break;
      case "bkrestore": { const v = $("#bkText").value.trim(); if (v) restore(v); break; }
      case "bkfile": $("#bkFile").click(); break;
    }
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { if (sheet) closeSheet(); return; }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("article[data-act]")) { ev.preventDefault(); openSheet("task", ev.target.dataset.id); }
  });
  document.addEventListener("submit", ev => {
    ev.preventDefault();
    if (ev.target.id === "addForm") addTask();
    if (ev.target.id === "habForm") addHabit();
  });
  document.addEventListener("input", ev => {
    if (ev.target.id === "addText") addPrefs.text = ev.target.value;
    if (ev.target.id === "habText") habDraft.t = ev.target.value;
  });
  document.addEventListener("change", async ev => {
    if (ev.target.id === "editText" && sheet) { const v = ev.target.value.trim(); if (v) mutate(() => { const t = byId(sheet.id); if (t) t.t = v; }); }
    if (ev.target.id === "habDom") habDraft.dom = +ev.target.value;
    if (ev.target.id === "bkFile") { const f = ev.target.files && ev.target.files[0]; if (f) restore(await f.text()); ev.target.value = ""; }
  });
  // save a title edit if the sheet closes before "change" fires
  document.addEventListener("focusout", ev => { if (ev.target.id === "editText" && sheet) { const v = ev.target.value.trim(); const t = byId(sheet.id); if (v && t && t.t !== v) mutate(() => { t.t = v; }); } });

  // refresh when returning to the app or the clock moves on
  let lastDay = today();
  function refresh(){ if (today() !== lastDay) { lastDay = today(); } if (!sheet) render(); else { renderHeader(); renderStrip(); renderLoad(); } }
  setInterval(refresh, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); if (T) showTimer(); } });

  // ---------- boot ----------
  load();
  if (!S.planDate) S.planDate = today();
  if (S.planDate < today() && !S.tasks.some(t => t.status === "todo" && (t.slot === "am" || t.slot === "pm"))) S.planDate = today();
  save(); render();
  try { const raw = localStorage.getItem(TKEY); if (raw) { T = JSON.parse(raw); if (T && byId(T.id)) showTimer(); else endTimer(); } } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  window.addEventListener("storage", e => { if (e.key === KEY) { load(); render(); } });

  // test hook (harmless in normal use)
  window.__nt = { get S(){ return S; }, tier, streak, dueOn, render };
})();
</script>
